name = "driftlab-api"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[env.dev]

[env.dev.vars]
MCP_ENDPOINT = "http://localhost:8787/mcp"
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-5-mini"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "driftlab"
database_id = "218da382-6678-411d-a1fa-c3c9d29c916a"
migrations_dir = "migrations"
remote = true

[dev]
port = 8788

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[vars]
MCP_ENDPOINT = "https://driftlab-mcp.sarthakkadam147.workers.dev/mcp"
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-5-mini"
ARMORIQ_USER_ID="driftlab-demo"
ARMORIQ_USER_EMAIL="sarthakkadam147@gmail.com"
ARMORIQ_AGENT_ID="driftlab-agent"
ARMORIQ_MCP_NAME="driftlab-mcp"
OPENROUTER_BASE_URL="https://openrouter.ai/api/v1"
OPENROUTER_MODEL="openrouter/free"
GROQ_BASE_URL="https://api.groq.com/openai/v1"
GROQ_MODEL="qwen/qwen3.8-27b"
GEMINI_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai"
GEMINI_MODEL="gemini-3.1-flash-lite"

[[d1_databases]]
binding = "DB"
database_name = "driftlab"
database_id = "218da382-6678-411d-a1fa-c3c9d29c916a"
 migrations_dir = "migrations"

