<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="drift" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shield" x1="30" y1="26" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#222c3f" stroke-width="2"/>

  <!-- Outer Drift Loop forming stylized 'D' -->
  <path d="M 21 16 H 33 C 43.5 16, 50 23, 50 32 C 50 41, 43.5 48, 33 48 H 21 Z" 
        stroke="url(#drift)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"/>

  <!-- Internal agent flow spine -->
  <path d="M 21 24 V 40" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Core Protected / ArmorIQ Node -->
  <circle cx="34" cy="32" r="4.5" fill="url(#shield)"/>
  
  <!-- Orbiting agent loop checkpoints -->
  <circle cx="21" cy="16" r="3.2" fill="#38bdf8"/>
  <circle cx="50" cy="32" r="3.2" fill="#818cf8"/>
  <circle cx="21" cy="48" r="3.2" fill="#10b981"/>
</svg>
